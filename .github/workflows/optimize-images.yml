name: Optimize site images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebP tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - name: Convert PNG assets to WebP
        run: |
          cwebp -quiet -q 78 -resize 1000 0 logo.png -o logo.webp
          for f in zahra abiha shyna momin noor; do
            cwebp -quiet -q 76 -resize 900 0 "$f.png" -o "$f.webp"
          done
          for f in work-1 elaris; do
            cwebp -quiet -q 78 -resize 1100 0 "$f.png" -o "$f.webp"
          done
          sed -i 's/logo\.png/logo.webp/g; s/zahra\.png/zahra.webp/g; s/abiha\.png/abiha.webp/g; s/shyna\.png/shyna.webp/g; s/momin\.png/momin.webp/g; s/noor\.png/noor.webp/g; s/work-1\.png/work-1.webp/g; s/elaris\.png/elaris.webp/g' index.html
      - name: Commit optimized assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html *.webp
          git diff --cached --quiet || git commit -m "Optimize portfolio images to WebP"
          git push
