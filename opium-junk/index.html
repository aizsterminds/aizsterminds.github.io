let page='home',filter='All',cart=[],selectedSize='M',activeProduct=null,drawer=null,menu=false;
const $=q=>document.querySelector(q),money=n=>'Rs. '+n.toLocaleString('en-PK'),photo=name=>ASSETS[name]||'';
const header=()=>`<header class="site-header ${page==='home'?'':'solid'}"><button class="mobile-toggle" aria-label="Open menu" onclick="openMenu()">☰</button><nav class="nav"><button onclick="go('shop')">SHOP</button><button onclick="go('shop','Graphic Tops')">COLLECTIONS</button><button onclick="go('archive')">ARCHIVE</button></nav><div class="brand" role="button" tabindex="0" onclick="go('home')"><div class="lamb">✝ ♱</div><div class="logo">Opium Junk</div></div><nav class="nav right"><button class="desktop-only" onclick="go('about')">ABOUT</button><button class="desktop-only" onclick="go('contact')">CONTACT</button><button onclick="openSearch()" aria-label="Search">⌕</button><button onclick="openCart()" aria-label="Cart">♧ <sup class="bag-number">${cart.reduce((n,x)=>n+x.qty,0)}</sup></button></nav></header>`;
const productCard=p=>`<article class="product-card"><div class="product-photo" onclick="openProduct(${p.id})"><img src="${photo(p.image)}" alt="${p.title}" loading="lazy"><button class="plus" aria-label="View ${p.title}" onclick="event.stopPropagation();openProduct(${p.id})">+</button></div><h3>${p.title}</h3><div class="price">${money(p.price)}</div></article>`;
const home=()=>`<section class="hero" style="--hero:url('${photo('hero')}')"><div class="hero-content"><div class="eyebrow">OPIUM JUNK &nbsp; / &nbsp; CHAPTER 001</div><h1>After<br>Dark,<br>Before<br>Dawn.</h1><p class="sub">CLOTHING FOR THE RESTLESS.</p><button class="link" onclick="go('shop')">SHOP THE DROP <span>⟶</span></button></div></section><section class="drops"><div class="section-label">CURRENT DROP</div><div class="product-grid">${PRODUCTS.map(productCard).join('')}</div></section><section class="arch-block"><img class="arch-image" src="${photo('ig1_2_0')}" alt="Opium Junk archive editorial"><div class="arch-copy"><div class="micro">THE ARCHIVE / 001</div><h2 class="serif">A Continuing<br>Study in<br>Obsession.</h2><button class="link" onclick="go('archive')">EXPLORE ARCHIVE <span>⟶</span></button></div></section>${newsletter()}`;
const shop=()=>`<div class="page-title"><div class="micro">OPIUM JUNK / THE COLLECTION</div><h1>Current Drop.</h1><p>THE PIECES YOU KEEP. THE NIGHTS YOU DON'T FORGET.</p></div><div class="filterbar">${['All','Graphic Tops','Long Sleeves'].map(x=>`<button class="${filter===x?'selected':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div><section class="shop-section"><div class="product-grid">${PRODUCTS.filter(p=>filter==='All'||p.category===filter).map(productCard).join('')}</div><p class="shop-note">CONCEPT COLLECTION — SAMPLE ITEMS AND PRICES FOR DESIGN PREVIEW ONLY.</p></section>`;
const archive=()=>`<div class="page-title"><div class="micro">CAMPAIGNS / PEOPLE / AFTER HOURS</div><h1>The Archive.</h1><p>NOT A LOOKBOOK. A RECORD OF THE NIGHTS.</p></div><section class="archive-grid">${ARCHIVE.map((x,i)=>`<div class="archive-tile"><img src="${photo(x)}" alt="Fashion archive photograph ${i+1}" loading="lazy"><span class="micro">FRAME / ${String(i+1).padStart(2,'0')}</span></div>`).join('')}</section>`;
const about=()=>`<div class="page-title"><div class="micro">THE WORLD OF OPIUM JUNK</div><h1>Nothing Sacred.</h1><p>BUILT FOR THE ONES WHO NEVER FIT THE FRAME.</p></div><div class="about-layout"><img src="${photo('ig1_1_1')}" alt="Opium Junk community"><div><div class="micro">AN INTRODUCTION</div><h2 class="serif">Made for<br>the hours<br>after midnight.</h2><p class="bodycopy">This is a design-direction preview, not the brand's official story. The final About page will carry Opium Junk's own words, origins, and point of view—without inventing a manifesto on their behalf.</p><button class="link" onclick="go('archive')">SEE THE ARCHIVE <span>⟶</span></button></div></div>`;
const contact=()=>`<div class="page-title"><div class="micro">SOMETHING ON YOUR MIND?</div><h1>Get in Touch.</h1><p>QUESTIONS, COLLABORATIONS, OR JUST A NOTE.</p></div><form class="contact-wrap" onsubmit="event.preventDefault();toast('Demo form — connect this to your Shopify contact form.');this.reset()"><label>YOUR NAME</label><input required placeholder="Name"><label>EMAIL ADDRESS</label><input type="email" required placeholder="Email"><label>MESSAGE</label><textarea required placeholder="Your message..."></textarea><button class="btn" type="submit">SEND MESSAGE ⟶</button></form>`;
const newsletter=()=>`<section class="newsletter"><h2>STAY IN THE CIRCLE.</h2><p class="text">The next drop never announces itself twice.</p><form onsubmit="event.preventDefault();toast('Demo signup — connect this to Shopify Email.');this.reset()"><input type="email" required placeholder="Your email address" aria-label="Email address"><button aria-label="Subscribe" type="submit">⟶</button></form><div class="helper">NEW DROPS · ARCHIVE RELEASES · EXCLUSIVE UPDATES</div></section>`;
const footer=()=>`<footer class="footer"><div class="logo">Opium Junk</div><div class="footer-nav"><a href="#shop" onclick="event.preventDefault();go('shop')">Shop</a><a href="#archive" onclick="event.preventDefault();go('archive')">Archive</a><a href="#about" onclick="event.preventDefault();go('about')">About</a><a href="#contact" onclick="event.preventDefault();go('contact')">Contact</a></div><small>© 2026 OPIUM JUNK · DESIGN PROTOTYPE</small></footer>`;
function render(){const content={home,shop,archive,about,contact}[page]();$('#app').innerHTML=header()+`<main class="page">${content}</main>`+footer();document.title=`${page==='home'?'After Dark, Before Dawn':page.toUpperCase()} — Opium Junk`;window.scrollTo(0,0)}
function go(p,f){page=p;filter=f||'All';drawer=null;menu=false;closeOverlays();render();try{history.replaceState(null,'','#'+p)}catch(e){}}
function setFilter(f){filter=f;render();}
function openMenu(){menu=true;const d=document.createElement('div');d.id='mobilemenu';d.className='nav-overlay';d.innerHTML=`<button class="x" onclick="closeOverlays()">×</button><div class="brand" onclick="go('home')" style="margin:0 auto"><div class="logo">Opium Junk</div></div><div class="big-links">${['home','shop','archive','about','contact'].map(x=>`<button onclick="go('${x}')">${x==='home'?'Home':x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="micro muted">CLOTHING FOR THE RESTLESS</div>`;document.body.append(d)}
function closeOverlays(){['mobilemenu','drawer-overlay','product-modal'].forEach(id=>{const x=document.getElementById(id);if(x)x.remove()});document.body.style.overflow='';drawer=null}
function openProduct(id){activeProduct=PRODUCTS.find(p=>p.id===id);selectedSize=activeProduct.sizes.includes('M')?'M':activeProduct.sizes[0];showProduct()}
function showProduct(){let p=activeProduct;document.getElementById('product-modal')?.remove();const d=document.createElement('div');d.className='modal';d.id='product-modal';d.onclick=e=>{if(e.target===d)closeOverlays()};d.innerHTML=`<section class="detail" role="dialog" aria-modal="true" aria-label="${p.title}"><button class="close" onclick="closeOverlays()">×</button><img class="detail-img" src="${photo(p.image)}" alt="${p.title}"><div class="detail-copy"><div class="micro">CURRENT DROP / ${p.category}</div><h2>${p.title}</h2><div class="price" style="text-align:left">${money(p.price)}</div><p>${p.description}</p><div class="micro">SELECT SIZE</div><div class="sizes">${p.sizes.map(s=>`<button class="${selectedSize===s?'active':''}" onclick="chooseSize('${s}')">${s}</button>`).join('')}</div><button class="btn" onclick="addToCart(${p.id},'${selectedSize}')">ADD TO BAG ⟶</button><div class="detail-meta">DEMO PRODUCT · IMAGES AND PRICES ARE ILLUSTRATIVE<br>Actual sizing, fabric details and stock must be linked to Shopify.</div></div></section>`;document.body.append(d);document.body.style.overflow='hidden'}
function chooseSize(s){selectedSize=s;showProduct()}
function addToCart(id,size){const found=cart.find(x=>x.id===id&&x.size===size);if(found)found.qty++;else cart.push({id,size,qty:1});closeOverlays();render();openCart();toast('Added to the bag')}
function openCart(){document.getElementById('drawer-overlay')?.remove();let total=cart.reduce((n,c)=>n+PRODUCTS.find(p=>p.id===c.id).price*c.qty,0);const d=document.createElement('div');d.className='overlay';d.id='drawer-overlay';d.onclick=e=>{if(e.target===d)closeOverlays()};d.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-label="Shopping bag"><div class="drawer-head"><h2>Your Bag.</h2><button class="close" onclick="closeOverlays()">×</button></div>${cart.length?cart.map((c,i)=>{const p=PRODUCTS.find(p=>p.id===c.id);return `<div class="cart-row"><img src="${photo(p.image)}" alt="${p.title}"><div><strong>${p.title}</strong><div class="minor">SIZE ${c.size} · ${money(p.price)}</div><div class="qty"><button aria-label="Decrease" onclick="setQty(${i},-1)">−</button>${c.qty}<button aria-label="Increase" onclick="setQty(${i},1)">+</button></div></div><button class="close" style="font-size:17px" aria-label="Remove" onclick="removeItem(${i})">×</button></div>`}).join('')+`<div class="cart-footer"><div class="total"><span class="micro">SUBTOTAL</span><span>${money(total)}</span></div><p class="muted" style="font-size:11px;line-height:1.7">Preview bag only. Shipping and checkout become live after Shopify integration.</p><button class="btn" onclick="toast('Demo checkout — Shopify integration required.')">CHECKOUT ⟶</button></div>`:`<div class="drawer-empty">Your bag is waiting for something after dark.<br><br><button class="link" onclick="go('shop')">EXPLORE THE DROP ⟶</button></div>`}</aside>`;document.body.append(d);document.body.style.overflow='hidden'}
function setQty(i,n){cart[i].qty+=n;if(cart[i].qty<1)cart.splice(i,1);render();openCart()}
function removeItem(i){cart.splice(i,1);render();openCart()}
function openSearch(){document.getElementById('drawer-overlay')?.remove();const d=document.createElement('div');d.className='overlay';d.id='drawer-overlay';d.onclick=e=>{if(e.target===d)closeOverlays()};d.innerHTML=`<aside class="drawer" role="dialog" aria-modal="true" aria-label="Search"><div class="drawer-head"><h2>Find Something.</h2><button class="close" onclick="closeOverlays()">×</button></div><div class="searchbar"><input id="searchInput" type="search" placeholder="Search the drop..." oninput="searchItems(this.value)" aria-label="Search products"><span>⌕</span></div><div class="search-results" id="searchResults"></div></aside>`;document.body.append(d);document.body.style.overflow='hidden';searchItems('');setTimeout(()=>$('#searchInput')?.focus(),100)}
function searchItems(s){const el=$('#searchResults');if(!el)return;const a=PRODUCTS.filter(p=>(p.title+' '+p.category).toLowerCase().includes(s.toLowerCase()));el.innerHTML=a.length?a.map(p=>`<button class="search-result" onclick="closeOverlays();openProduct(${p.id})"><img src="${photo(p.image)}" alt=""><span>${p.title}<br><span class="muted">${money(p.price)}</span></span></button>`).join(''):'<p class="muted">No pieces found.</p>'}
let toastTimeout;function toast(x){const t=$('#toast');t.textContent=x;t.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>t.classList.remove('show'),2500)}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOverlays()});
if(['shop','archive','about','contact'].includes(location.hash.slice(1)))page=location.hash.slice(1);render();
</script></body></html>
